name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: [self-hosted, Linux, X64, xcsh-chrome-extension, ubuntu-24.04]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned (not `latest`) so `bun install --frozen-lockfile` stays reproducible
          # and matches the committed bun.lock + local dev. Bump with a lockfile regen. (#248)
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check:types

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify dist artifacts
        run: |
          set -e
          for f in manifest.json service-worker.js accessibility-tree.js agent-visual-indicator.js options.html options.js managed_schema.json; do
            test -f "dist/$f" || { echo "missing dist/$f"; exit 1; }
          done
          # manifest must NOT contain a 'key' field (Chrome Web Store assigns the ID)
          if grep -q '"key"' dist/manifest.json; then echo "manifest.json must not contain 'key' for CWS"; exit 1; fi
          echo "dist artifacts verified"
